<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyGlot IDE</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8'/><stop offset='50%' stop-color='%23818cf8'/><stop offset='100%' stop-color='%23c084fc'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%23161b22'/><path d='M10 9L6 16l4 7M22 9l4 7-4 7M18 7l-4 18' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Title Bar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <button class="sidebar-toggle" id="toggleSidebarBtn" title="Toggle File Explorer (Ctrl+B)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div class="logo-wrapper">
        <svg class="logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#818cf8" flood-opacity="0.5"/>
            </filter>
          </defs>
          <rect width="32" height="32" rx="7" fill="#1f242d"/>
          <g filter="url(#glow)">
            <path d="M10 10L5.5 16L10 22" stroke="url(#polyGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 10L26.5 16L22 22" stroke="url(#polyGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18.5 8L13.5 24" stroke="url(#polyGrad)" stroke-width="2.2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <span class="title">PolyGlot <span class="badge-ide">IDE</span></span>
    </div>
    <div class="titlebar-right">
      <span class="shortcut-hint">Ctrl+Enter to run · Ctrl+B for files</span>
    </div>
  </div>

  <!-- Main Body: Sidebar + Editor Container -->
  <div class="workspace">

    <!-- Collapsible VS Code style Explorer Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">EXPLORER</span>
        <div class="sidebar-actions">
          <button class="icon-btn" id="newFileBtn" title="New File">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          </button>
          <button class="icon-btn" id="newFolderBtn" title="New Folder">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
          </button>
        </div>
      </div>
      <!-- File Tree Container -->
      <div class="file-tree" id="fileTree"></div>
    </aside>

    <!-- Sidebar Resize Divider -->
    <div class="sidebar-resizer" id="sidebarResizer"></div>

    <!-- Main Editor & Terminal Area -->
    <main class="container">

      <!-- Open File Tabs Bar -->
      <div class="tabs-bar" id="tabsBar"></div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="language-badges" id="languageBadges"></div>
        </div>
        <div class="toolbar-right">
          <div class="live-status" id="liveStatus" title="Users collaborating right now">
            <span class="live-dot"></span>
            <span id="userCount">1 live</span>
          </div>
          <button class="share-btn" id="shareBtn" title="Copy share link for live collaboration">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            <span id="shareText">Share</span>
          </button>
          <button class="run-btn" id="runBtn">
            <span class="run-icon">▶</span> Run
          </button>
        </div>
      </div>

      <!-- Editor -->
      <div class="editor-area" id="editorArea">
        <div id="editor"></div>
      </div>

      <!-- Terminal Resize Handle -->
      <div class="resize-handle" id="resizeHandle"></div>

      <!-- Bottom Panel (Output & Stdin Tabs) -->
      <div class="output-panel" id="outputPanel">
        <div class="output-header">
          <div class="panel-tabs">
            <button class="panel-tab active" id="tabOutputBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              <span>Output</span>
            </button>
            <button class="panel-tab" id="tabInputBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span>Custom Input (stdin)</span>
              <span class="stdin-dot" id="stdinDot" style="display:none;" title="Input provided">●</span>
            </button>
          </div>
          <button class="output-clear" id="clearBtn">Clear</button>
        </div>
        <div class="output-content" id="outputContent">
          <span class="placeholder">Press ▶ Run or Ctrl+Enter to execute…</span>
        </div>
        <div class="stdin-container" id="stdinContainer" style="display: none;">
          <textarea id="stdinInput" class="stdin-textarea" spellcheck="false" placeholder="Enter custom standard input (for scanf, scanner.nextLine(), input(), cin, etc.)..."></textarea>
        </div>
      </div>

    </main>

  </div>

  <!-- Socket.io and Monaco -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
